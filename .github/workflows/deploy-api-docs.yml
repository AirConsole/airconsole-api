name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master  # Trigger the workflow on a push to the 'master' branch
    paths:
      - 'airconsole-*.js'

jobs:
  generate-and-deploy:
    name: Generate and deploy live docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    # Install npm dependencies (global or local)
    - name: Install npm dependencies
      run: |
        npm install -g jsdoc@3.6.11

    # Install Python dependencies if required
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Run the Python script to generate HTML content (builds into docs/live, creates index.html)
    - name: Generate live documentation
      run: |
        python .github/generate-docs.py --api=./airconsole-1.11.0.js --target=live

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/live  # The directory containing the generated HTML files
        keep_files: true  # Preserve other content (e.g. beta/ subdirectory) on gh-pages
