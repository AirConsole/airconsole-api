name: Deploy Beta Docs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'beta/airconsole-*.js'

jobs:
  generate-and-deploy:
    name: Generate and deploy beta docs
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Install npm dependencies
      run: |
        npm install -g jsdoc@3.6.11

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # generate-docs.py builds into docs/beta and creates index.html
    - name: Generate beta documentation
      run: |
        python .github/generate-docs.py --api=./beta/airconsole-1.11.1.js --target=beta

    - name: Deploy to GitHub Pages (beta subdirectory)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/beta
        destination_dir: beta  # Deploy to /beta/ subdirectory
        keep_files: true  # Preserve other content on gh-pages
